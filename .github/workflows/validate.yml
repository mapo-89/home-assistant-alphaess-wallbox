name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python files
        run: python -m compileall -q custom_components/alphaess_wallbox
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [Path("hacs.json"), *Path("custom_components/alphaess_wallbox").rglob("*.json")]
          for file in files:
              with file.open(encoding="utf-8") as stream:
                  json.load(stream)
              print(f"valid: {file}")
          PY

